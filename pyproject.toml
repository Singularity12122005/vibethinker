[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vibethinker-experiments"
version = "0.1.0"
description = "Auditable post-training experiments for small reasoning models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6",
]

[project.optional-dependencies]
data = [
  "datasets",
  "math-verify",
  "pyarrow",
  "sympy",
  "transformers",
]
sft = [
  "accelerate",
  "datasets",
  "peft",
  "torch",
  "transformers",
]
rl = [
  "math-verify",
  "sympy",
  "torch",
  "transformers",
]
eval = [
  "aiohttp",
  "math-verify",
  "vllm",
]
dev = [
  "pytest",
  "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vibethinker_experiments = ["evaluation/schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
